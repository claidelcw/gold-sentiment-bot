name: Gold Sentiment Backtest

# Runs automatically once a week, and can still be triggered manually anytime
# from the Actions tab. GitHub Actions cron is in UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"  # every Sunday at 23:00 UTC

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-backtest.txt

      - name: Run backtest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_backtest.py

      - name: Upload results CSV
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results.csv
