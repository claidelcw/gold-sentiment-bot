name: Gold Sentiment Bot

on:
  schedule:
    - cron: "0 21 * * 0"          # Sun 21:00 UTC = Sun 23:00 local -> weekend recap
    - cron: "0 22 * * 0-4"        # Sun-Thu 22:00 UTC -> next day's local 00:00 (Mon-Fri market-open pings)
    - cron: "0 0-20/2 * * 1-4"    # Mon-Thu, every 2 hours from local 02:00 to 22:00
    - cron: "0 0-16/2 * * 5"      # Friday, every 2 hours from local 02:00 to 18:00 (last run)
  workflow_dispatch: {}           # lets you click "Run workflow" manually on GitHub to test it

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_bot.py
