name: Gold Sentiment Bot

on:
  schedule:
    - cron: "0 21-23 * * 0"   # Sunday 21:00–23:00 UTC (your 23:00–01:00)
    - cron: "0 * * * 1-4"     # Monday–Thursday, every hour, all day
    - cron: "0 0-16 * * 5"    # Friday 00:00–16:00 UTC (your 02:00–18:00)
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_bot.py
